website:
  page-navigation: true
  title: "COGS 137"
  description: "Homepage for COGS 137 - Practical Data Science in R, Fall 2026."
  
  image: images/background.png
  favicon: images/favicon.ico
  
  site-url: "https://cogs137-fa26.github.io/cogs137-fa26/"

  open-graph: true
  
  page-footer:
    right: "This page is built with 🤍, inspiration from Mine Çetinkaya-Rundel, and [Quarto](https://quarto.org/)."
    left: 
      - text: "License"
        href: LICENSE.md
  
