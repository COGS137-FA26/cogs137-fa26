format:
  html:
    theme:
      light: [cosmo, styles/cogs137.scss]
      dark: [cosmo, styles/cogs137.scss, styles/dark.scss]
    toc: true
    code-copy: true
    highlight-style: a11y   # WCAG-contrast syntax colors (auto a11y-dark in dark mode)
    include-before-body: _includes/skip-link.html
    # When FA26 is over, uncomment the next line and re-render to add the
    # "archived" banner (links to cogs137.github.io) and hide the site from search engines.
    # include-in-header: _includes/archive-banner.html
    code-overflow: wrap

execute:
  freeze: auto

editor: visual